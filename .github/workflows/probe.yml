name: Probe
on:
  workflow_dispatch:
    inputs:
      npm_tag:
        required: true
        default: next
        type: choice
        options: [next, latest]
jobs:
  publish:
    if: inputs.npm_tag == 'next' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Stand-in for npm publish
        run: echo "PUBLISHED from ref=$GITHUB_REF sha=$GITHUB_SHA tag=${{ inputs.npm_tag }}"
