name: Probe
on:
  workflow_dispatch:
    inputs:
      npm_tag:
        required: true
        default: next
        type: choice
        options: [next, latest]
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ${{ inputs.npm_tag == 'latest' && 'npm' || 'npm-prerelease' }}
    steps:
      - name: Stand-in for npm publish
        run: echo "PUBLISHED ref=$GITHUB_REF tag=${{ inputs.npm_tag }}"
